# StockAlert — AWS dev box. Spec: docs/operations/deployment_dev.md §3.
#
# Lives at /opt/stockalert/docker-compose.yml on the instance (synced from
# infra/dev/ by scripts/deploy/release.sh). The project directory is
# /opt/stockalert, so `./.env` is /opt/stockalert/.env — rendered by
# bin/render_env.sh from app.env + release.env + SSM Parameter Store, mode 0600.
# The same file feeds `${VAR}` interpolation below and `env_file:` for the app
# containers; postgres/clickhouse/caddy receive only the single value they need.
#
# One image, two roles: `api` serves every customer request and runs no
# writer; `worker` owns the Schwab streamer and every scheduled loop. The two
# anchors below are the whole difference, so splitting `worker` into
# `stream` + `jobs` later is a third service definition, not a code change.

x-awslogs: &awslogs
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:?AWS_REGION missing from .env (app.env)}
    awslogs-group: ${LOG_GROUP:?LOG_GROUP missing from .env (app.env)}
    awslogs-create-group: "false"   # CloudFormation owns the group (14-day retention)
    tag: "{{.Name}}"                # one log stream per container name

# Mirrors the laptop's .env as of 2026-11-05 — the known-good set; change here
# and there together. (Not .env.example's defaults: three flags differ.)

# Streamer + the writers that ride on the live stream. Worker only; api sets them all off.
x-stream-flags: &stream-flags
  STREAM_PROVIDER: schwab
  JOURNAL_ENABLED: "true"
  LIVE_LAKE_WRITER_ENABLED: "true"
  OPTIONS_SNAPSHOT_ENABLED: "true"        # exactly one process may own this (startup_flow.md)
  ELLIOTT_LIVE_SCANNER_ENABLED: "false"   # off on the laptop: wave detection on every live bar

# Scheduled loops. Worker only; api sets them all off.
x-jobs-flags: &jobs-flags
  LAKE_GUARD_ENABLED: "true"            # nightly: archive ClickHouse-only bars into the lake
  CH_STATE_SNAPSHOT_ENABLED: "true"     # nightly: export non-rebuildable state to s3://<lake>/ch_state/
  POLYGON_NIGHTLY_ENABLED: "false"        # off since the flat-files subscription lapsed; the daily
                                          # refresh runs inside scripts/paper_daily_pipeline.py
  SCHWAB_NIGHTLY_ENABLED: "true"
  FUTURES_NIGHTLY_ENABLED: "true"
  FUTURES_POLYGON_NIGHTLY_ENABLED: "true"
  CH_RECONCILE_ENABLED: "true"
  NEWS_INGEST_ENABLED: "true"
  ELLIOTT_RECOMPUTE_ENABLED: "false"      # off on the laptop

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE missing — bin/release.sh <image> writes release.env}
  env_file: ./.env
  restart: unless-stopped
  logging: *awslogs
  depends_on:
    clickhouse:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *awslogs
    ports:
      - "80:80"     # ACME HTTP-01 challenge + redirect to 443 only
      - "443:443"
      - "443:443/udp"
    environment:
      DEV_HOST: ${DEV_HOST:?DEV_HOST missing from .env (render_env.sh derives it from the EIP)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates — losing this re-issues against LE rate limits
      - caddy_config:/config
    depends_on:
      - api
      - worker

  api:
    <<: *app
    # The request path. Nothing here may block: no streamer, no loops, no limits
    # (it is the thing we protect). Request-driven hotload/gap-fill stay on.
    environment:
      STREAM_PROVIDER: none                 # the sentinel — "" would inherit DATA_PROVIDER
      JOURNAL_ENABLED: "false"
      LIVE_LAKE_WRITER_ENABLED: "false"
      OPTIONS_SNAPSHOT_ENABLED: "false"
      ELLIOTT_LIVE_SCANNER_ENABLED: "false"
      POLYGON_NIGHTLY_ENABLED: "false"
      SCHWAB_NIGHTLY_ENABLED: "false"
      FUTURES_NIGHTLY_ENABLED: "false"
      FUTURES_POLYGON_NIGHTLY_ENABLED: "false"
      CH_RECONCILE_ENABLED: "false"
      NEWS_INGEST_ENABLED: "false"
      ELLIOTT_RECOMPUTE_ENABLED: "false"
      LAKE_GUARD_ENABLED: "false"
      CH_STATE_SNAPSHOT_ENABLED: "false"
      SYMBOL_HOTLOAD_ENABLED: "true"
      SYMBOL_GAPFILL_ENABLED: "true"

  worker:
    <<: *app
    # Streamer + batcher + every scheduled loop. Capped at one of the two
    # vCPUs and 2.5 GiB so a nightly cannot starve api or OOM the box.
    environment:
      <<: [*stream-flags, *jobs-flags]
    cpus: "1.0"
    mem_limit: 2500m
    volumes:
      - paperdata:/app/data/paper   # paper-trading files survive container recreation

  # One-off operator tools (not started by `up`). Run through compose, NEVER `docker run
  # --env-file`: the rendered .env single-quotes its values and docker keeps the quotes.
  #   docker compose --profile tools run -d --no-deps --name ch-bootstrap bootstrap \
  #     python -u scripts/ch_bootstrap.py --state-mode replace --files --parallelism 2
  # Own limits (the worker's 1 CPU / 2.5 GiB is too small for a bulk rebuild); every
  # writer and the streamer stay off so a tool run can never become a second owner.
  bootstrap:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    environment:
      STREAM_PROVIDER: none
      LAKE_GUARD_ENABLED: "false"
      CH_STATE_SNAPSHOT_ENABLED: "false"
    cpus: "2.0"
    mem_limit: 5000m   # measured: 3 parallel 20-year symbols exceeded 3.5 GiB; bootstrap now windows to 3 years
    volumes:
      - paperdata:/app/data/paper

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    logging: *awslogs
    environment:
      CLICKHOUSE_DB: stocks
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD missing from .env (SSM clickhouse_password)}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - chdata:/var/lib/clickhouse
      # Mount the ONE file, never the directory: the image ships
      # config.d/docker_related_config.xml (listen_host 0.0.0.0). Mounting a
      # directory over config.d hides it and ClickHouse listens on 127.0.0.1 only,
      # so its own healthcheck passes while api/worker cannot connect.
      - ./clickhouse/config.d/system_logs.xml:/etc/clickhouse-server/config.d/system_logs.xml:ro
    # No host ports: api/worker reach it as clickhouse:8123 on the compose
    # network; the operator uses `docker compose exec clickhouse clickhouse-client`.
    mem_limit: 3g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *awslogs
    environment:
      POSTGRES_DB: stockalert_identity
      POSTGRES_USER: stockalert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from .env (SSM postgres_password)}
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockalert -d stockalert_identity"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  paperdata:
  chdata:
  identity_pgdata:
  caddy_data:
  caddy_config:
