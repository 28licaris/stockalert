# StockAlert devbox sshd drop-in (installed by bootstrap.sh).
# Keys only (EC2 Instance Connect pushes a 60-second key per connect).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# Drop dead connections (laptop slept) within ~3 min so the idle timer sees them gone.
ClientAliveInterval 60
ClientAliveCountMax 3
AllowAgentForwarding yes
AllowTcpForwarding yes
